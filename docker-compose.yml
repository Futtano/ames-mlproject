services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ames-ml-api:latest
    container_name: ames-ml-api
    ports:
      - "5000:${PORT:-5000}"
    volumes:
      - ./artifacts:/app/artifacts
      - ./config:/app/config
      - ./.log:/app/.log
    environment:
      - LOG_LEVEL=INFO
      - PROJECT_ROOT=/app
      - PORT=${PORT:-5000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
